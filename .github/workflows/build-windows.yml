name: Build Windows (C++)

# Builds Mine-imator.exe via the CppProject/CppGen pipeline (Docs/BUILD.md) — no GameMaker involved.
#
# The slow part is a one-time static Qt 5.15.9 build (source clone + configure + jom), which is cached
# across runs via actions/cache keyed on QT_CACHE_KEY below. First run will be very slow (likely 1-3+
# hours) and MAY exceed GitHub-hosted runners' 6-hour hard job limit — if it does, increase parallelism
# is not really possible (jom already uses all cores); consider a self-hosted runner instead, or bump
# QT_CACHE_KEY only when you intend to pay the long-build cost again (e.g. Qt version change).
#
# NOTE: this workflow has not been run end-to-end yet — expect to debug the Qt-build steps on the first
# real run (no Windows machine was available to test it before committing).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'GmProject/**'
      - 'CppProject/**'
      - 'CppGen/**'
      - 'Scripts/**'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEV_DIR: C:\Dev
  QT_VERSION: 5.15.9
  # Bump this suffix to force a fresh Qt build (e.g. after changing QT_VERSION or configure flags).
  QT_CACHE_KEY: qt-5.15.9-win64-msvc2022-v1

jobs:
  build:
    # Pinned rather than windows-latest: verified this image ships Visual Studio Enterprise 2022
    # (17.14) with the full C++ desktop workload and CMake 3.31.6, which the VS 2022 CMake generator
    # below needs — windows-latest is a floating label that may point past this by the time you read it.
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 (for CppGen)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Qt static build from cache
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.DEV_DIR }}\Qt\${{ env.QT_VERSION }}\build
          key: ${{ env.QT_CACHE_KEY }}

      - name: Restore header-only source trees from cache
        id: cache-headers
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DEV_DIR }}\Libzip
            ${{ env.DEV_DIR }}\FreeType
            ${{ env.DEV_DIR }}\FFmpeg
            ${{ env.DEV_DIR }}\OpenAL
          key: headers-libzip1.9.2-freetype2.9.1-ffmpeg5.0-openal1.22.0-v1

      # CppProject/CMakeLists.txt only needs headers from these (the compiled libs are already
      # prebuilt and committed under CppProject/External/Win64) — no compilation needed here.
      - name: Download header-only source trees (Libzip / FreeType / FFmpeg / OpenAL)
        if: steps.cache-headers.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # -TimeoutSec: without it a stalled connection hangs indefinitely instead of failing into retry.
          # Browser User-Agent: some hosts (notably SourceForge) serve an HTML interstitial instead of the
          # file to PowerShell's default UA.
          function Get-FileWithRetry($Uri, $OutFile, $MaxAttempts = 5) {
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  try {
                      Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing -TimeoutSec 120 `
                          -Headers @{ "User-Agent" = "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
                      return
                  } catch {
                      if ($i -eq $MaxAttempts) { throw }
                      $wait = [math]::Pow(2, $i)
                      Write-Warning "Download failed ($Uri): $($_.Exception.Message) — retrying in ${wait}s (attempt $i/$MaxAttempts)"
                      Start-Sleep -Seconds $wait
                  }
              }
          }

          # tar.exe failures don't throw a PowerShell error ($ErrorActionPreference doesn't cover native
          # exe exit codes), so check $LASTEXITCODE explicitly or a corrupt/HTML download extracts silently.
          function Expand-TarWithCheck($ArchivePath, $Args, $Dest) {
              & tar @Args $ArchivePath -C $Dest
              if ($LASTEXITCODE -ne 0) { throw "tar failed (exit $LASTEXITCODE) extracting $ArchivePath" }
          }

          New-Item -ItemType Directory -Force -Path "$env:DEV_DIR\Libzip", "$env:DEV_DIR\FreeType", "$env:DEV_DIR\FFmpeg", "$env:DEV_DIR\OpenAL" | Out-Null

          Get-FileWithRetry "https://libzip.org/download/libzip-1.9.2.tar.gz" "$env:TEMP\libzip.tar.gz"
          Expand-TarWithCheck "$env:TEMP\libzip.tar.gz" @("-xzf") "$env:DEV_DIR\Libzip"

          # SourceForge mirror instead of download.savannah.gnu.org — Savannah's mirror network 502s often.
          Get-FileWithRetry "https://sourceforge.net/projects/freetype/files/freetype2/2.9.1/freetype-2.9.1.tar.gz/download" "$env:TEMP\freetype.tar.gz"
          Expand-TarWithCheck "$env:TEMP\freetype.tar.gz" @("-xzf") "$env:DEV_DIR\FreeType"

          Get-FileWithRetry "https://ffmpeg.org/releases/ffmpeg-5.0.tar.xz" "$env:TEMP\ffmpeg.tar.xz"
          Expand-TarWithCheck "$env:TEMP\ffmpeg.tar.xz" @("-xf") "$env:DEV_DIR\FFmpeg"

          Get-FileWithRetry "https://openal-soft.org/openal-releases/openal-soft-1.22.0.tar.bz2" "$env:TEMP\openal.tar.bz2"
          Expand-TarWithCheck "$env:TEMP\openal.tar.bz2" @("-xf") "$env:DEV_DIR\OpenAL"

      # Everything below this point only runs when the Qt cache misses.
      - name: Install Strawberry Perl (for Qt's init-repository)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install strawberryperl -y --no-progress

      - name: Install Jom
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Get-FileWithRetry($Uri, $OutFile, $MaxAttempts = 5) {
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  try {
                      Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing -TimeoutSec 120
                      return
                  } catch {
                      if ($i -eq $MaxAttempts) { throw }
                      $wait = [math]::Pow(2, $i)
                      Write-Warning "Download failed ($Uri): $($_.Exception.Message) — retrying in ${wait}s (attempt $i/$MaxAttempts)"
                      Start-Sleep -Seconds $wait
                  }
              }
          }

          New-Item -ItemType Directory -Force -Path "$env:DEV_DIR\Jom" | Out-Null
          Get-FileWithRetry "https://download.qt.io/official_releases/jom/jom_1_1_3.zip" "$env:TEMP\jom.zip"
          Expand-Archive -Path "$env:TEMP\jom.zip" -DestinationPath "$env:DEV_DIR\Jom" -Force
          Add-Content -Path $env:GITHUB_PATH -Value "$env:DEV_DIR\Jom"

      # Always run (not gated on the Qt cache) — the later "CMake: configure" step in
      # Build-FromCpp.ps1 uses the Visual Studio generator and fails to locate VS without this,
      # even on a Qt cache hit where the Qt-build-only steps above are skipped.
      - name: Setup MSVC x64 dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Mirrors CppProject/BUILD.md's Windows 64-bit Qt steps 8.1-8.7, using https instead of the
      # git:// protocol (same host, more reliable through CI network egress). qt5's init-repository
      # clones ~40 submodules over HTTPS, so a mid-transfer "Recv failure / RPC failed" on any one of
      # them is expected occasionally — retry each git/perl call and raise the HTTP post buffer (the
      # standard fix for curl "Recv failure" on large packfile transfers).
      - name: Clone Qt 5.15 and init submodules
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Invoke-WithRetry([scriptblock]$Command, $MaxAttempts = 4) {
              for ($i = 1; $i -le $MaxAttempts; $i++) {
                  & $Command
                  if ($LASTEXITCODE -eq 0) { return }
                  if ($i -eq $MaxAttempts) { throw "Command failed after $MaxAttempts attempts (exit $LASTEXITCODE)" }
                  $wait = 10 * $i
                  Write-Warning "Command failed (exit $LASTEXITCODE) — retrying in ${wait}s (attempt $($i+1)/$MaxAttempts)"
                  Start-Sleep -Seconds $wait
              }
          }

          git config --global http.postBuffer 1048576000

          $qtVersionDir = "$env:DEV_DIR\Qt\$env:QT_VERSION"
          New-Item -ItemType Directory -Force -Path $qtVersionDir | Out-Null
          Set-Location $qtVersionDir

          if (-not (Test-Path "qt5")) {
              Invoke-WithRetry { git clone https://code.qt.io/qt/qt5.git }
          }
          Set-Location "qt5"
          Invoke-WithRetry { git checkout 5.15 }
          # -f: a retry after a partial failure otherwise refuses with "already initialized" instead of
          # resuming (already-cloned submodules are still skipped underneath; -f only lifts that guard).
          # -qtwebengine: it embeds full Chromium (qtwebengine-chromium) — huge, and configure.bat below
          # already passes -skip qtwebengine, so cloning it is pure waste (and the most failure-prone step).
          Invoke-WithRetry { perl init-repository -f --module-subset=default,-qtwebengine }

      # Uses -schannel (Windows' native TLS backend) instead of CppProject/BUILD.md's -openssl-linked:
      # the app has no direct OpenSSL/QSsl usage in source, and Shining Light's static-lib packaging
      # (folder/filename layout) drifts across OpenSSL versions in ways Qt 5.15's configure.bat doesn't
      # tolerate — schannel avoids that whole external dependency for CI.
      - name: Configure Qt (static, release)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%DEV_DIR%\Qt\%QT_VERSION%\qt5"
          configure.bat -platform win32-msvc -prefix "%DEV_DIR%/Qt/%QT_VERSION%/build" -opensource -confirm-license -release -static -static-runtime -qt-libjpeg -opengl desktop -schannel -no-icu -nomake tests -nomake examples -nomake tools -skip qt3d -skip qtmultimedia -skip activeqt -skip qtandroidextras -skip qtconnectivity -skip datavis3d -skip qtdoc -skip gamepad -skip qtgraphicaleffects -skip qtcharts -skip qtlocation -skip qtlottie -skip qtnetworkauth -skip qtpurchasing -skip qtquick3d -skip qtquickcontrols -skip qtquickcontrols2 -skip qtquicktimeline -skip qtremoteobjects -skip qtscxml -skip qtsensors -skip qtserialbus -skip qtserialport -skip qtspeech -skip qtvirtualkeyboard -skip qtwayland -skip qtwebengine -skip qtwebglplugin -skip qtwebchannel -skip qtwebsockets -skip qtwebview -skip qtxmlpatterns
          if errorlevel 1 exit /b 1

      - name: Build Qt (jom)
        if: steps.cache-qt.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%DEV_DIR%\Qt\%QT_VERSION%\qt5"
          jom
          if errorlevel 1 exit /b 1
          jom install
          if errorlevel 1 exit /b 1

      - name: Build Mine-imator (CppGen + CMake + package)
        shell: pwsh
        run: .\Scripts\Build-FromCpp.ps1 -FreshZip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mine-imator-Win64
          path: Release\*.zip
          if-no-files-found: error
          retention-days: 14
